<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة تركس وكونكان</title>
<meta name="theme-color" content="#0a0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تركس">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app on a card-table black. Red and silver come from the ace icon. */
:root{
  --bg:#0a0b0c;
  --bg-glow:#1b2026;
  --surface:#14171a;
  --surface-2:#1c2024;
  --line:#2b3036;
  --fg:#eef0f2;
  --muted:#8e969e;
  --silver:#c8cdd3;
  --accent:#d93a40;
  --accent-ink:#ffffff;
  --accent-soft:#2a1416;
  --pos:#4cc38a;
  --neg:#ff7a7a;
  --shade:rgba(0,0,0,.62);
  --font-display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --font-body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--bg);
  color:var(--fg);
  font:16px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{min-height:100%;display:flex;flex-direction:column;max-width:520px;margin-inline:auto;padding-block:0 28px}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.num.neg{color:var(--neg)}
.num.pos{color:var(--pos)}
.num.zero{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;min-height:60px;background:var(--bg)}
.top h2{flex:1;font:700 20px var(--font-display);text-align:start}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:var(--silver);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.big{min-height:68px;font:700 21px var(--font-display)}
.btn.danger{background:transparent;border-color:#5a2427;color:var(--neg)}
.btn[disabled]{opacity:.42;cursor:default}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;color:var(--silver);text-decoration:underline;text-underline-offset:4px;padding:10px;min-height:44px}
.stack{display:flex;flex-direction:column;gap:12px}

/* home */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;padding-top:max(24px,env(safe-area-inset-top,0px))}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.logo{width:116px;height:116px;border-radius:28px;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.hero h1{font:700 34px/1.2 var(--font-display);margin-top:12px}
.hero .sub{color:var(--muted)}
.resume{justify-content:space-between}
.resume small{color:var(--muted);font-weight:500}
.credit{text-align:center;color:var(--muted);font-size:14px;padding-top:6px}
.home .credit{margin-top:auto}
.steps{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.steps li{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.6}
.steps b{color:var(--silver)}
.ok-note{text-align:center;color:var(--pos);font-weight:700;padding:6px}

/* setup */
.lead{color:var(--muted);margin:2px 0 14px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:start;width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.opt b{font:700 18px var(--font-display)}
.opt span{color:var(--muted);font-size:14.5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;color:var(--muted)}
.field input,.val input{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.field input::placeholder{color:#59616a}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{min-width:56px;min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.chip-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
details.vals{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px}
details.vals summary{min-height:50px;display:flex;align-items:center;cursor:pointer;font-weight:700}
details.vals .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0 16px}
.val{display:flex;flex-direction:column;gap:4px;min-width:0}
.val input{min-height:44px;font-size:16px;direction:ltr;text-align:center}
.val span{font-size:13px;color:var(--muted)}
.setup-body{display:flex;flex-direction:column;gap:18px;padding-bottom:8px}

/* scoreboard */
.board{display:grid;gap:10px;margin:6px 0 10px}
.board.two{grid-template-columns:1fr 1fr}
.side{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px 12px;text-align:center;min-width:0}
.side .nm{display:block;color:var(--silver);font-size:15px;overflow-wrap:anywhere}
.side .big{display:block;font:700 44px/1.15 var(--font-display)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:2px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:700}
.kpts{font-size:14px;color:var(--muted)}
.chip .num{margin-right:6px}

/* kingdom rows */
.sec{font:700 17px var(--font-display);margin:22px 0 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start}
.row[disabled]{cursor:default}
.row .glyph{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:700 20px var(--font-display);color:var(--silver);flex:none}
.row .glyph.red{color:var(--accent)}
.row .rname{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;line-height:1.3}
.row .rname small{color:var(--muted);font-weight:500;font-size:13px}
.row .rpts{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.row .rpts i{color:var(--line);font-style:normal}
.row .rpts em{color:var(--muted);font-style:normal;font-weight:500;font-size:13px}
.row.done{background:var(--surface-2)}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);font-weight:700;vertical-align:top}
th[scope="row"],thead th:first-child{text-align:start;color:var(--silver)}
thead th{font-size:14px;color:var(--silver);overflow-wrap:anywhere}
td small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
tfoot th,tfoot td{border-bottom:0;background:var(--surface-2)}
tr:last-child>*{border-bottom:0}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* banner */
.banner{background:var(--accent-soft);border:1px solid #5a2427;border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.banner b{font:700 19px var(--font-display)}
.banner .two-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* konkan */
.kcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.kcard.lead-card{border-color:var(--silver)}
.kcard .nm{display:block;color:var(--silver);font-size:15px;overflow-wrap:anywhere}
.kcard .big{display:block;font:700 36px/1.2 var(--font-display)}
.track{direction:ltr;position:relative;height:8px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.track .fill{position:absolute;top:0;bottom:0;background:var(--pos)}
.track .fill.neg{background:var(--neg)}
.track .zero{position:absolute;top:0;bottom:0;width:2px;background:var(--muted)}
.limits{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* history */
.hcard{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.hcard summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.hcard summary::-webkit-details-marker{display:none}
.hcard .h1{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.hcard .h1 small{color:var(--muted);font-weight:500}
.hcard .h2{display:flex;gap:14px;flex-wrap:wrap;color:var(--silver);font-size:15px}
.hcard .h2 b{font-weight:700}
.hbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20;animation:fade .15s ease-out}
.sheet{position:fixed;inset-inline:0;bottom:0;margin-inline:auto;width:100%;max-width:520px;max-height:90%;overflow-y:auto;z-index:21;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .2s ease-out}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 2px}
.sheet h3{font:700 22px var(--font-display)}
.sheet .hint{color:var(--muted);font-size:14.5px;margin-top:-8px}
.q{font-weight:700}
.numgrid{display:grid;gap:8px}
.numgrid button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:6px}
.numgrid button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.numgrid.big button{min-height:58px;font-size:17px;overflow-wrap:anywhere}
.preview{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap;padding:12px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);font-weight:700;min-height:52px;align-items:center}
.preview span.t{color:var(--muted);font-weight:500;margin-inline-end:6px;font-size:14px}
.place{display:flex;align-items:center;gap:10px}
.place .pl{width:92px;flex:none;line-height:1.25;font-weight:700}
.place .pl small{display:block;color:var(--muted);font-weight:500}
.place .seg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.place .seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:4px 6px;overflow-wrap:anywhere;font-size:15px}
.place .seg button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.warn{color:var(--neg);font-size:14px}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);text-align:start}
.pick-row[disabled]{opacity:.45;cursor:default}
.pick-row .glyph{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font:700 21px var(--font-display);color:var(--silver);flex:none}
.pick-row .glyph.red{color:var(--accent)}
.pick-row .pn{flex:1;display:flex;flex-direction:column;font-weight:700;line-height:1.3}
.pick-row .pn small{color:var(--muted);font-weight:500;font-size:13.5px}
.pick-row .st{color:var(--pos);font-weight:700;font-size:14px}
.kr{display:flex;align-items:center;gap:10px}
.kr .who{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.kr .sg{width:50px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:700 24px var(--font-display);flex:none;padding:0}
.kr .sg.minus{color:var(--neg);border-color:#5a2427}
.kr .sg.plus{color:var(--pos)}
.kr input{width:118px;min-height:50px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;text-align:center;direction:ltr;flex:none}
.two-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.shade,.sheet{animation:none}}
</style>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>

<body>

<div id="app"></div>
<div id="sheet-root"></div>

<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ===================== LOGIC (pure) ===================== */
// <logic>
var MINUS = '−';
var DEFAULT_VALS = { king:75, queen:25, diamond:10, slap:15, trex:[200,150,100,50] };
var CONTRACTS = [
  { id:'king',     name:'الملك',    glyph:'♥', red:true, max:1 },
  { id:'queens',   name:'البنات',   glyph:'♠', max:4,  valKey:'queen' },
  { id:'diamonds', name:'الديناري', glyph:'♦', red:true, max:13, valKey:'diamond' },
  { id:'slaps',    name:'اللطوش',   glyph:'♣', max:13, valKey:'slap' },
  { id:'trex',     name:'التركس',   glyph:'7', max:4 }
];
var PLACE_NAMES = ['المركز الأول','المركز الثاني','المركز الثالث','المركز الرابع'];

function contractOf(id){ for (var i=0;i<CONTRACTS.length;i++) if (CONTRACTS[i].id===id) return CONTRACTS[i]; return null; }
function perOf(c, vals){ return c.id==='king' ? vals.king : vals[c.valKey]; }

// inp: {count:n} for count games (count = what team A / "our team" took), {places:[0|1|null x4]} for trex
function calcPts(m, cid, inp){
  var c = contractOf(cid), two = m.mode==='two';
  if (cid==='trex'){
    var a=0,b=0;
    for (var i=0;i<4;i++){
      if (inp.places[i]===0) a += m.vals.trex[i];
      else if (inp.places[i]===1) b += m.vals.trex[i];
    }
    return [a, two ? b : null];
  }
  var per = perOf(c, m.vals);
  return [ -per*inp.count, two ? -per*(c.max-inp.count) : null ];
}
function entryValid(cid, inp){
  if (cid==='trex'){
    var a=0,b=0;
    for (var i=0;i<4;i++){ if (inp.places[i]===0) a++; else if (inp.places[i]===1) b++; }
    return a===2 && b===2;
  }
  return typeof inp.count==='number' && inp.count>=0 && inp.count<=contractOf(cid).max;
}
function sumPts(entries, two){
  var a=0,b=0;
  entries.forEach(function(e){ a+=e.pts[0]; if (two) b+=e.pts[1]; });
  return [a, two ? b : null];
}
function matchTotals(m){
  var two = m.mode==='two', a=0, b=0;
  m.kingdoms.forEach(function(k){ var t=sumPts(k.entries,two); a+=t[0]; if (two) b+=t[1]; });
  return [a, two ? b : null];
}
function curKingdom(m){ return m.kingdoms[m.kingdoms.length-1]; }
function trexAdd(m, cid, inp){
  var k = curKingdom(m);
  if (m.status==='finished') return null;
  for (var i=0;i<k.entries.length;i++) if (k.entries[i].g===cid) return null;
  k.entries.push({ g:cid, inp:inp, pts:calcPts(m,cid,inp) });
  var kIndex = m.kingdoms.length-1, kingdomDone = k.entries.length===CONTRACTS.length, finished=false;
  if (kingdomDone){
    if (m.kingdoms.length>=m.total){ m.status='finished'; m.finishedAt=Date.now(); finished=true; }
    else m.kingdoms.push({ entries:[] });
  }
  return { kingdomDone:kingdomDone, finished:finished, kIndex:kIndex };
}
function trexRemove(m, cid){
  var k = curKingdom(m);
  for (var i=0;i<k.entries.length;i++) if (k.entries[i].g===cid){ k.entries.splice(i,1); return true; }
  return false;
}
function trexUndo(m){
  var last = curKingdom(m);
  if (!last.entries.length && m.kingdoms.length>1){ m.kingdoms.pop(); last = curKingdom(m); }
  if (!last.entries.length) return false;
  last.entries.pop();
  m.status='playing'; delete m.finishedAt;
  return true;
}
function playedCount(m){ var n=0; m.kingdoms.forEach(function(k){ n+=k.entries.length; }); return n; }

function konTotals(m){
  var t = m.names.map(function(){ return 0; });
  m.rounds.forEach(function(r){ r.forEach(function(v,i){ t[i]+=v; }); });
  return t;
}
function argmax(arr, skip){
  var best=-1;
  for (var i=0;i<arr.length;i++){ if (i===skip) continue; if (best<0 || arr[i]>arr[best]) best=i; }
  return best;
}
function konCheck(m){
  var t = konTotals(m), winners=[], losers=[];
  t.forEach(function(s,i){
    if (s>=m.win) winners.push(i);
    if (m.loss>0 && s<=-m.loss) losers.push(i);
  });
  if (winners.length){
    var w = winners[0];
    winners.forEach(function(i){ if (t[i]>t[w]) w=i; });
    return { winner:w, loser:null, reason:'win' };
  }
  if (losers.length){
    var l = losers[0];
    losers.forEach(function(i){ if (t[i]<t[l]) l=i; });
    return { winner:argmax(t,l), loser:l, reason:'loss' };
  }
  return null;
}
function parseRound(vals, signs){
  var any=false;
  var out = vals.map(function(s,i){
    if (s!=='' ){ any=true; }
    var n = parseInt(s||'0',10); if (isNaN(n)) n=0;
    return (signs[i]<0 && n!==0) ? -n : n;
  });
  return any ? out : null;
}
function lat(s){
  return String(s).replace(/[٠-٩]/g, function(d){ return d.charCodeAt(0)-0x660; })
                  .replace(/[۰-۹]/g, function(d){ return d.charCodeAt(0)-0x6F0; });
}
function pn(str, def){
  var n = parseInt(lat(str).replace(/[^0-9]/g,''),10);
  return (isNaN(n) || n<=0) ? def : n;
}
// </logic>

/* ===================== STATE ===================== */
var KEY = 'trex-kon-v1';
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.history)) { d.cur = d.cur || {}; return d; }
    }
  } catch(e){}
  return { history:[], cur:{} };
}
var D = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function findM(id){ for (var i=0;i<D.history.length;i++) if (D.history[i].id===id) return D.history[i]; return null; }
function curMatch(g){ return D.cur[g] ? findM(D.cur[g]) : null; }

var installEv = null, justInstalled = false;
function isStandalone(){
  try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
  catch(e){ return false; }
}

var S = {
  screen:'home',
  sheet:null,
  setup:{
    tmode:'two', tn:['',''], tk:4, vopen:false,

/* ===================== HELPERS ===================== */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n, plus){
  if (n===null || n===undefined) return '';
  var s, cls;
  if (n<0){ s = MINUS+Math.abs(n); cls='neg'; }
  else if (n>0){ s = (plus?'+':'')+n; cls = plus?'pos':''; }
  else { s='0'; cls='zero'; }
  return '<span class="num '+cls+'">'+s+'</span>';
}
function tNames(m){ return m.mode==='two' ? m.names : [m.names[0]||'فريقك']; }
function fmtDate(ts){
  try { return new Date(ts).toLocaleString('ar-u-nu-latn',{ day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return ''; }
}
var ICON = {
  back:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  menu:'<svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  undo:'<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>'
};
function hintOf(c, v){
  if (c.id==='king') return num(-v.king)+' على من أخذه';
  if (c.id==='queens') return num(-v.queen)+' لكل بنت';
  if (c.id==='diamonds') return num(-v.diamond)+' لكل ورقة';
  if (c.id==='slaps') return num(-v.slap)+' لكل لطشة';
  return v.trex.map(function(x){ return num(x,true); }).join(' · ');
}
function topbar(title, back, right){
  return '<header class="top">'+
    (back?'<button class="icon-btn" data-a="'+back+'" aria-label="رجوع">'+ICON.back+'</button>':'')+
    '<h2>'+title+'</h2>'+(right||'')+'</header>';
}

function kingdomsTable(m){
  var two = m.mode==='two', names = tNames(m), cum=[0,0], rows='';
  m.kingdoms.forEach(function(k,i){
    if (k.entries.length!==CONTRACTS.length) return;
    var t = sumPts(k.entries,two);
    cum[0]+=t[0]; if (two) cum[1]+=t[1];
    rows += '<tr><th scope="row">المملكة '+(i+1)+'</th><td>'+num(t[0],true)+'<small>'+num(cum[0])+'</small></td>'+
      (two?'<td>'+num(t[1],true)+'<small>'+num(cum[1])+'</small></td>':'')+'</tr>';
  });
  if (!rows) return '';
  var tot = matchTotals(m);
  var head = '<tr><th>&nbsp;</th>'+names.map(function(n){ return '<th>'+esc(n)+'</th>'; }).join('')+'</tr>';
  var foot = '<tr><th scope="row">إجمالي المباراة</th><td>'+num(tot[0],true)+'</td>'+(two?'<td>'+num(tot[1],true)+'</td>':'')+'</tr>';
  return '<div class="scroll"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody><tfoot>'+foot+'</tfoot></table></div>'+
    '<p class="note">الرقم الصغير تحت نقاط كل مملكة هو المجموع حتى تلك المملكة</p>';
}

function winnerLine(m){
  var two = m.mode==='two', t = matchTotals(m), names = tNames(m);
  if (!two) return 'نتيجة فريقك النهائية: '+num(t[0],true);
  if (t[0]===t[1]) return 'تعادل الفريقان بـ '+num(t[0],true);
  var w = t[0]>t[1]?0:1;
  return 'فاز '+esc(names[w])+' بفارق '+num(Math.abs(t[0]-t[1]));
}

    '<div class="two-btns"><button class="btn" data-a="undoTrex">'+ICON.undo+'تراجع</button><button class="btn primary" data-a="newTrex">مباراة جديدة</button></div></div>' : '';

    '<div class="rows">'+rows+'</div>'+

function konBar(m, score){
  var lo = m.loss>0 ? -m.loss : 0, hi = m.win, span = hi-lo;
  var zero = (0-lo)/span*100;
  var c = Math.max(lo, Math.min(hi, score));
  var pos = (c-lo)/span*100;
  var left = Math.min(zero,pos), width = Math.abs(pos-zero);
  return '<div class="track"><span class="fill'+(score<0?' neg':'')+'" style="left:'+left+'%;width:'+width+'%"></span>'+
    (m.loss>0?'<span class="zero" style="left:'+zero+'%"></span>':'')+'</div>';
}

function konView(m){
  var t = konTotals(m), fin = m.status==='finished';
  var top = 0; t.forEach(function(v,i){ if (v>t[top]) top=i; });
  var cards = m.names.map(function(nm,i){
    return '<div class="kcard'+(fin&&m.result&&m.result.winner===i?' lead-card':'')+'"><span class="nm">'+esc(nm)+'</span><b class="big">'+num(t[i],true)+'</b>'+konBar(m,t[i])+'</div>';
  }).join('');
  var limits = '<div class="limits"><span class="chip">حد الفوز '+num(m.win)+'</span>'+
    (m.loss>0?'<span class="chip">حد الخسارة '+num(-m.loss)+'</span>':'')+'</div>';
  var banner = '';
  if (fin){
    var r = m.result || {winner:top,reason:'manual'};
    var why = r.reason==='win' ? esc(m.names[r.winner])+' وصل إلى حد الفوز' :
              r.reason==='loss' ? esc(m.names[r.loser])+' وصل إلى حد الخسارة' : 'تم إنهاء اللعبة يدويًا';
    banner = '<div class="banner"><b>فاز '+esc(m.names[r.winner])+'</b><span>'+why+'</span>'+
      '<div class="two-btns"><button class="btn" data-a="undoRound">'+ICON.undo+'تراجع</button><button class="btn primary" data-a="newKon">لعبة جديدة</button></div></div>';
  }
  var add = fin ? '' : '<button class="btn primary big" data-a="addRound">'+ICON.plus+' إضافة جولة</button>';
  var head = '<tr><th>#</th>'+m.names.map(function(n){ return '<th>'+esc(n)+'</th>'; }).join('')+'</tr>';
  var body = '';
  for (var i=m.rounds.length-1;i>=0;i--){
    body += '<tr><th scope="row">'+(i+1)+'</th>'+m.rounds[i].map(function(v){ return '<td>'+num(v,true)+'</td>'; }).join('')+'</tr>';
  }
  var foot = '<tr><th scope="row">المجموع</th>'+t.map(function(v){ return '<td>'+num(v,true)+'</td>'; }).join('')+'</tr>';
  var table = m.rounds.length ?
    '<div class="scroll"><table><thead>'+head+'</thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>' :
    '<p class="note">تظهر الجولات هنا بعد إضافتها</p>';
  var undo = (!fin && m.rounds.length) ? '<button class="btn" data-a="undoRound">'+ICON.undo+'تراجع عن آخر جولة</button>' : '';
  var menuBtn = '<button class="icon-btn" data-a="menu" aria-label="القائمة">'+ICON.menu+'</button>';
  return topbar('كونكان','home',menuBtn)+'<div class="kcards">'+cards+'</div>'+limits+banner+add+
    '<h3 class="sec">الجولات</h3>'+table+(undo?'<div class="stack" style="margin-top:12px">'+undo+'</div>':'')+creditHTML();
}

function historyView(){
  var list = D.history.filter(function(m){
    return m.game==='trex' ? playedCount(m)>0 : m.rounds.length>0;
  }).sort(function(a,b){ return b.startedAt-a.startedAt; });
  var body;
  if (!list.length){
    body = '<p class="empty">لا توجد مباريات محفوظة بعد</p>';
  } else {
    body = list.map(function(m){
      var status = m.status==='finished' ? 'منتهية' : 'غير منتهية';
      var h2, detail;
      if (m.game==='trex'){
        var names = tNames(m), tot = matchTotals(m);
        h2 = names.map(function(n,i){ return '<span>'+esc(n)+' <b>'+num(tot[i],true)+'</b></span>'; }).join('');
        detail = kingdomsTable(m) || '<p class="note">لم تنتهِ أي مملكة بعد</p>';
      } else {
        var t = konTotals(m);
        h2 = m.names.map(function(n,i){ return '<span>'+esc(n)+' <b>'+num(t[i],true)+'</b></span>'; }).join('');
        var head = '<tr><th>#</th>'+m.names.map(function(n){ return '<th>'+esc(n)+'</th>'; }).join('')+'</tr>';
        var rows = m.rounds.map(function(r,i){ return '<tr><th scope="row">'+(i+1)+'</th>'+r.map(function(v){ return '<td>'+num(v,true)+'</td>'; }).join('')+'</tr>'; }).join('');
        detail = '<div class="scroll"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
      }
      var open = (m.status==='playing') ? '<button class="btn" data-a="openMatch" data-id="'+m.id+'">متابعة المباراة</button>' : '';
      return '<details class="hcard"><summary><div class="h1"><span>'+(m.game==='trex'?'تركس':'كونكان')+' · '+status+'</span><small>'+fmtDate(m.startedAt)+'</small></div>'+
        '<div class="h2">'+h2+'</div></summary><div class="hbody">'+detail+open+
        '<button class="btn danger" data-a="askDel" data-id="'+m.id+'">حذف المباراة</button></div></details>';
    }).join('');
    body += '<button class="btn danger" data-a="askClear" style="margin-top:6px">مسح السجل كله</button>';
  }
  return topbar('سجل المباريات','home')+body+creditHTML();
}

}

function entryInp(sh){ return sh.g==='trex' ? { places:sh.places } : { count:sh.count }; }
function entrySheet(m){
  var sh = S.sheet, c = contractOf(sh.g), two = m.mode==='two', names = tNames(m);
  var A = two ? names[0] : 'فريقك', B = two ? names[1] : null;

  if (sh.g==='king'){

      body = '<p class="q">من أخذ الملك؟</p><div class="numgrid big" style="grid-template-columns:1fr 1fr">'+

        '<button data-a="setCount" data-n="0" aria-pressed="'+(sh.count===0)+'">'+esc(B)+'</button></div>';
    } else {
      body = '<p class="q">هل أخذ فريقك الملك؟</p><div class="numgrid big" style="grid-template-columns:1fr 1fr">'+
        '<button data-a="setCount" data-n="1" aria-pressed="'+(sh.count===1)+'">نعم</button>'+
        '<button data-a="setCount" data-n="0" aria-pressed="'+(sh.count===0)+'">لا</button></div>';
    }
  } else if (sh.g==='trex'){
    hint = 'لكل فريق مركزان';
    body = '<p class="q">من حصل على كل مركز؟</p>';
    for (var i=0;i<4;i++){
      body += '<div class="place"><span class="pl">'+PLACE_NAMES[i]+'<small>'+num(m.vals.trex[i],true)+'</small></span><div class="seg">'+
        '<button data-a="setPlace" data-i="'+i+'" data-v="0" aria-pressed="'+(sh.places[i]===0)+'">'+esc(two?A:'فريقك')+'</button>'+
        '<button data-a="setPlace" data-i="'+i+'" data-v="1" aria-pressed="'+(sh.places[i]===1)+'">'+esc(two?B:'الخصم')+'</button></div></div>';
    }
  } else {
    var per = perOf(c,m.vals);
    hint = (sh.g==='queens'?'كل بنت ':sh.g==='diamonds'?'كل ورقة ':'كل لطشة ')+num(-per)+' · العدد الكلي '+c.max;
    var btns = '';
    for (var n=0;n<=c.max;n++) btns += '<button data-a="setCount" data-n="'+n+'" aria-pressed="'+(sh.count===n)+'">'+n+'</button>';

  }
  var valid = entryValid(sh.g, entryInp(sh));
  var prev;
  if (valid){
    var p = calcPts(m, sh.g, entryInp(sh));
    prev = '<span><span class="t">'+esc(A)+'</span>'+num(p[0],true)+'</span>'+(two?'<span><span class="t">'+esc(B)+'</span>'+num(p[1],true)+'</span>':'');
  } else {
    prev = '<span class="t">'+(sh.g==='trex'?'اختر مركزين لكل فريق':'اختر العدد')+'</span>';
  }
  return sheetWrap('<h3>'+c.name+'</h3><p class="hint">'+hint+'</p>'+body+
    '<div class="preview">'+prev+'</div>'+
    '<button class="btn primary big" data-a="saveEntry"'+(valid?'':' disabled')+'>حفظ</button>'+
    '<button class="btn" data-a="close">إلغاء</button>');
}
function viewEntrySheet(m){
  var sh = S.sheet, c = contractOf(sh.g), k = curKingdom(m), two = m.mode==='two', names = tNames(m), e = null;
  k.entries.forEach(function(x){ if (x.g===sh.g) e = x; });
  if (!e) return '';
  var lines = '<div class="preview"><span><span class="t">'+esc(names[0])+'</span>'+num(e.pts[0],true)+'</span>'+
    (two?'<span><span class="t">'+esc(names[1])+'</span>'+num(e.pts[1],true)+'</span>':'')+'</div>';
  var detail = '';
  if (sh.g==='trex'){
    detail = e.inp.places.map(function(w,i){ return '<p>'+PLACE_NAMES[i]+': <b>'+esc(w===0?names[0]:(two?names[1]:'الخصم'))+'</b></p>'; }).join('');
  } else if (sh.g==='king'){
    detail = '<p>الملك مع <b>'+esc(e.inp.count===1?names[0]:(two?names[1]:'الخصم'))+'</b></p>';
  } else {
    detail = '<p>'+esc(names[0])+': <b>'+e.inp.count+'</b>'+(two?' · '+esc(names[1])+': <b>'+(c.max-e.inp.count)+'</b>':'')+'</p>';
  }
  return sheetWrap('<h3>'+c.name+'</h3>'+detail+lines+
    '<button class="btn danger" data-a="delEntry" data-g="'+sh.g+'">حذف وإعادة اللعب</button>'+
    '<button class="btn" data-a="close">إغلاق</button>');
}
function kEndSheet(m){
  var sh = S.sheet, two = m.mode==='two', names = tNames(m);
  var k = m.kingdoms[sh.k], t = sumPts(k.entries,two), tot = matchTotals(m);
  var rows = '<tr><th scope="row">نتيجة المملكة</th><td>'+num(t[0],true)+'</td>'+(two?'<td>'+num(t[1],true)+'</td>':'')+'</tr>'+
    '<tr><th scope="row">إجمالي المباراة</th><td>'+num(tot[0],true)+'</td>'+(two?'<td>'+num(tot[1],true)+'</td>':'')+'</tr>';
  var head = '<tr><th>&nbsp;</th>'+names.map(function(n){ return '<th>'+esc(n)+'</th>'; }).join('')+'</tr>';
  var fin = m.status==='finished';
  return sheetWrap('<h3>'+(fin?'انتهت المباراة':'انتهت المملكة '+(sh.k+1))+'</h3>'+
    (fin?'<p class="q">'+winnerLine(m)+'</p>':'')+
    '<div class="scroll"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="hint">تم حفظ النتيجة في السجل</p>'+
    (fin?'<button class="btn primary big" data-a="newTrex">مباراة جديدة</button><button class="btn" data-a="close">عرض النتيجة</button>'
        :'<button class="btn primary big" data-a="close">المملكة '+(sh.k+2)+'</button>'));
}
function menuSheet(g){
  return sheetWrap('<h3>القائمة</h3>'+
    '<button class="btn" data-a="history">سجل المباريات</button>'+
    '<button class="btn" data-a="'+(g==='trex'?'newTrex':'newKon')+'">'+(g==='trex'?'مباراة جديدة':'لعبة جديدة')+'</button>'+
    '<button class="btn danger" data-a="askFinish">إنهاء الآن وحفظ النتيجة</button>'+
    '<button class="btn" data-a="close">إغلاق</button>');
}
function confirmSheet(){
  var sh = S.sheet;
  return sheetWrap('<h3>'+esc(sh.title)+'</h3><p class="hint">'+esc(sh.text)+'</p>'+
    '<button class="btn danger" data-a="'+sh.yes+'" data-id="'+(sh.id||'')+'">'+esc(sh.yesLabel)+'</button>'+
    '<button class="btn" data-a="close">إلغاء</button>');
}
function roundSheet(m){
  var sh = S.sheet, rows = m.names.map(function(n,i){
    var neg = sh.signs[i]<0;
    return '<div class="kr"><span class="who">'+esc(n)+'</span>'+
      '<button class="sg '+(neg?'minus':'plus')+'" data-a="sign" data-i="'+i+'" aria-label="'+(neg?'سالب':'موجب')+'">'+(neg?MINUS:'+')+'</button>'+
      '<input id="kr'+i+'" inputmode="numeric" maxlength="4" placeholder="0" value="'+esc(sh.vals[i])+'" autocomplete="off"></div>';
  }).join('');
  var ok = parseRound(sh.vals, sh.signs)!==null;
  return sheetWrap('<h3>جولة '+(m.rounds.length+1)+'</h3><p class="hint">اكتب نقاط كل لاعب في هذه الجولة. اضغط الإشارة لتغييرها إلى سالب</p>'+rows+
    '<button class="btn primary big" id="saveRound" data-a="saveRound"'+(ok?'':' disabled')+'>حفظ الجولة</button>'+
    '<button class="btn" data-a="close">إلغاء</button>');
}
function konEndSheet(m){
  var r = m.result, t = konTotals(m);
  var why = r.reason==='win' ? esc(m.names[r.winner])+' وصل إلى حد الفوز '+num(m.win) :
            r.reason==='loss' ? esc(m.names[r.loser])+' وصل إلى حد الخسارة '+num(-m.loss) : 'تم إنهاء اللعبة يدويًا';
  var order = t.map(function(v,i){ return i; }).sort(function(a,b){ return t[b]-t[a]; });
  var rows = order.map(function(i){ return '<tr><th scope="row">'+esc(m.names[i])+'</th><td>'+num(t[i],true)+'</td></tr>'; }).join('');
  return sheetWrap('<h3>فاز '+esc(m.names[r.winner])+'</h3><p class="q">'+why+'</p>'+
    '<div class="scroll"><table><tbody>'+rows+'</tbody></table></div>'+
    '<p class="hint">تم حفظ النتيجة في السجل</p>'+
    '<button class="btn primary big" data-a="newKon">لعبة جديدة</button><button class="btn" data-a="close">عرض النتيجة</button>');
}
function installHelpSheet(){
  return sheetWrap('<h3>تثبيت التطبيق</h3>'+
    '<ul class="steps">'+
    '<li><b>كروم (أندرويد):</b> اضغط زر القائمة ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</li>'+
    '<li><b>سفاري (آيفون):</b> اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</li>'+
    '</ul>'+
    '<p class="hint">افتح التطبيق مرة واحدة والإنترنت شغال، وبعدها يعمل بدون نت.</p>'+
    '<button class="btn primary" data-a="close">تمام</button>');
}
function sheetView(){
  var sh = S.sheet; if (!sh) return '';
  var tm = curMatch('trex'), km = curMatch('kon');
  switch (sh.t){
    case 'pick': return pickSheet();
    case 'installHelp': return installHelpSheet();
    case 'trexPick': return tm ? trexPickSheet(tm) : '';
    case 'entry': return tm ? entrySheet(tm) : '';
    case 'view': return tm ? viewEntrySheet(tm) : '';
    case 'kEnd': return tm ? kEndSheet(tm) : '';
    case 'menu': return menuSheet(sh.g);
    case 'confirm': return confirmSheet();
    case 'round': return km ? roundSheet(km) : '';
    case 'konEnd': return km && km.result ? konEndSheet(km) : '';
  }
  return '';
}

/* ===================== RENDER ===================== */
var $app = document.getElementById('app'), $sheet = document.getElementById('sheet-root');
function render(){
  var v = '';
  var tm = curMatch('trex'), km = curMatch('kon');
  if (S.screen==='trex' && !tm) S.screen='home';
  if (S.screen==='kon' && !km) S.screen='home';
  switch (S.screen){
    case 'home': v = homeView(); break;
    case 'trexSetup': v = trexSetupView(); break;
    case 'trex': v = trexView(tm); break;
    case 'konSetup': v = konSetupView(); break;
    case 'kon': v = konView(km); break;
    case 'history': v = historyView(); break;
  }
  $app.innerHTML = v;
  $sheet.innerHTML = sheetView();
  if (S.sheet && S.sheet.t==='round' && S.sheet.focus){
    S.sheet.focus = false;
    setTimeout(function(){ var f = document.getElementById('kr0'); if (f) { try { f.focus(); } catch(e){} } }, 60);
  }
}
function go(screen){ S.screen = screen; S.sheet = null; window.scrollTo(0,0); render(); }

/* ===================== ACTIONS ===================== */
function newTrexMatch(){
  var s = S.setup, two = s.tmode==='two', v = s.v;
  var vals = {
    king:pn(v.vk,75), queen:pn(v.vq,25), diamond:pn(v.vd,10), slap:pn(v.vs,15),
    trex:[pn(v.vt0,200),pn(v.vt1,150),pn(v.vt2,100),pn(v.vt3,50)]
  };
  var m = {
    id:uid(), game:'trex', mode:s.tmode,
    names: two ? [(s.tn[0]||'').trim()||'الفريق الأول', (s.tn[1]||'').trim()||'الفريق الثاني'] : ['فريقك'],
    total:s.tk, vals:vals, status:'playing', startedAt:Date.now(), kingdoms:[{entries:[]}]
  };
  D.history.push(m); D.cur.trex = m.id; save();
  go('trex');
}
function newKonMatch(){
  var s = S.setup, n = s.kn, names = [];
  for (var i=0;i<n;i++) names.push((s.knames[i]||'').trim() || ('اللاعب '+(i+1)));
  var loss = parseInt(lat(s.loss).replace(/[^0-9]/g,''),10); if (isNaN(loss) || loss<0) loss = 0;
  var m = { id:uid(), game:'kon', names:names, win:pn(s.win,100), loss:loss, rounds:[], status:'playing', startedAt:Date.now() };
  D.history.push(m); D.cur.kon = m.id; save();
  go('kon');
}
function finishNow(g){
  var m = curMatch(g); if (!m) return;
  m.status='finished'; m.finishedAt=Date.now();
  if (g==='kon'){ var t = konTotals(m); m.result = { winner:argmax(t,-1), loser:null, reason:'manual' }; }
  save(); S.sheet = null; render();
}

function act(a, ds){
  var tm = curMatch('trex'), km = curMatch('kon'), sh = S.sheet;
  switch (a){
    case 'close': S.sheet = null; render(); break;
    case 'openPick': S.sheet = { t:'pick' }; render(); break;
    case 'installHelp': S.sheet = { t:'installHelp' }; render(); break;
    case 'install':
      var ev = installEv;
      if (!ev){ S.sheet = { t:'installHelp' }; render(); break; }
      installEv = null;
      try {
        ev.prompt();
        if (ev.userChoice && ev.userChoice.then) ev.userChoice.then(function(c){ if (c && c.outcome==='accepted') justInstalled = true; render(); });
      } catch(x){}
      render(); break;
    case 'chooseGame': go(ds.g==='trex' ? 'trexSetup' : 'konSetup'); break;
    case 'home': go('home'); break;
    case 'history': go('history'); break;
    case 'resume': go(ds.g); break;
    case 'openMatch': D.cur[findM(ds.id).game] = ds.id; save(); go(findM(ds.id).game); break;

    case 'tmode': S.setup.tmode = ds.v; render(); break;
    case 'tk': S.setup.tk = +ds.n; render(); break;
    case 'startTrex': newTrexMatch(); break;
    case 'newTrex': go('trexSetup'); break;

    case 'openTrexPick': S.sheet = { t:'trexPick' }; render(); break;
    case 'startEntry':
      if (!tm) break;
      S.sheet = { t:'entry', g:ds.g, count:null, places:[null,null,null,null] }; render(); break;
    case 'setCount': sh.count = +ds.n; render(); break;
    case 'setPlace': sh.places[+ds.i] = +ds.v; render(); break;
    case 'saveEntry':
      if (!tm || !sh || !entryValid(sh.g, entryInp(sh))) break;
      var r = trexAdd(tm, sh.g, entryInp(sh));
      save();
      S.sheet = (r && r.kingdomDone) ? { t:'kEnd', k:r.kIndex } : null;
      render(); break;
    case 'viewEntry': S.sheet = { t:'view', g:ds.g }; render(); break;
    case 'delEntry': if (tm){ trexRemove(tm, ds.g); tm.status='playing'; save(); } S.sheet = null; render(); break;
    case 'undoTrex': if (tm){ trexUndo(tm); save(); } S.sheet = null; render(); break;
    case 'menu': S.sheet = { t:'menu', g:S.screen }; render(); break;
    case 'askFinish':
      S.sheet = { t:'confirm', title:'إنهاء الآن؟', text:'تُحفظ النتيجة الحالية في السجل وتنتهي المباراة.', yes:'finishYes', yesLabel:'نعم، أنهِ المباراة', id:S.screen };
      render(); break;
    case 'finishYes': finishNow(ds.id); break;

    case 'kn': S.setup.kn = +ds.n; render(); break;
    case 'setWin': S.setup.win = String(ds.n); render(); break;
    case 'startKon': newKonMatch(); break;
    case 'newKon': go('konSetup'); break;
    case 'addRound': if (km){ S.sheet = { t:'round', vals:km.names.map(function(){ return ''; }), signs:km.names.map(function(){ return 1; }), focus:true }; render(); } break;
    case 'sign': sh.signs[+ds.i] = -sh.signs[+ds.i]; render(); break;
    case 'saveRound':
      if (!km || !sh) break;
      var row = parseRound(sh.vals, sh.signs); if (!row) break;
      km.rounds.push(row);
      var res = konCheck(km);
      if (res){ km.status='finished'; km.result=res; km.finishedAt=Date.now(); S.sheet = { t:'konEnd' }; } else { S.sheet = null; }
      save(); render(); break;
    case 'undoRound':
      if (km && km.rounds.length){ km.rounds.pop(); km.status='playing'; delete km.result; delete km.finishedAt; save(); }
      S.sheet = null; render(); break;

    case 'askDel':
      S.sheet = { t:'confirm', title:'حذف المباراة؟', text:'تُحذف من السجل نهائيًا.', yes:'delYes', yesLabel:'حذف', id:ds.id }; render(); break;
    case 'delYes':
      D.history = D.history.filter(function(m){ return m.id!==ds.id; });
      Object.keys(D.cur).forEach(function(g){ if (D.cur[g]===ds.id) delete D.cur[g]; });
      save(); S.sheet = null; render(); break;
    case 'askClear':
      S.sheet = { t:'confirm', title:'مسح السجل كله؟', text:'تُحذف كل المباريات المحفوظة ولا يمكن استرجاعها.', yes:'clearYes', yesLabel:'مسح الكل' }; render(); break;
    case 'clearYes': D.history = []; D.cur = {}; save(); S.sheet = null; render(); break;
  }
}

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!t || t.disabled) return;
  act(t.getAttribute('data-a'), t.dataset);
});
document.addEventListener('input', function(e){
  var el = e.target, id = el.id || '';
  if (/^tn[01]$/.test(id)) S.setup.tn[+id.charAt(2)] = el.value;
  else if (/^kn[0-3]$/.test(id)) S.setup.knames[+id.charAt(2)] = el.value;
  else if (id==='kwin') S.setup.win = el.value;
  else if (id==='kloss') S.setup.loss = el.value;
  else if (/^v[kqds]$|^vt[0-3]$/.test(id)) S.setup.v[id] = el.value;
  else if (/^kr[0-3]$/.test(id) && S.sheet && S.sheet.t==='round'){
    var clean = lat(el.value).replace(/[^0-9]/g,'');
    if (clean!==el.value) el.value = clean;
    S.sheet.vals[+id.charAt(2)] = clean;
    var b = document.getElementById('saveRound');
    if (b) b.disabled = parseRound(S.sheet.vals, S.sheet.signs)===null;
  }
});
document.addEventListener('toggle', function(e){
  if (e.target && e.target.id==='vdet') S.setup.vopen = e.target.open;
}, true);
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.sheet){ S.sheet = null; render(); }
});

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); installEv = e;
  if (S.screen==='home' && !S.sheet) render();
});
window.addEventListener('appinstalled', function(){
  installEv = null; justInstalled = true;
  if (S.screen==='home') render();
});

try { if (navigator.serviceWorker) navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){}

render();
})();
</script>

</body>
</html>
